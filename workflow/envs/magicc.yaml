# Conda environment for `snakemake --use-conda` runs of the reproduction
# workflow (WS7.4).  Pins match conda/environment.yml and
# docker/requirements-lock.txt; conda/conda-lock.yml is the authoritative,
# fully-resolved lock.
name: magicc-workflow
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.9
  - numpy=1.26.4
  - numba=0.63.1
  - llvmlite=0.46.0
  - scipy=1.17.0
  - h5py=3.15.1
  - hdf5=1.14.6
  - pandas=2.2.3
  - pip
  - pip:
      - onnxruntime==1.23.2
